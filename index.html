<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#020617" />
<title>Vibe Lab</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950">
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

/* ====== 1. Signaux : mini event-bus pub/sub ====== */
function createSignalBus() {
  const listeners = new Map();
  return {
    on(event, fn) {
      if (!listeners.has(event)) listeners.set(event, new Set());
      listeners.get(event).add(fn);
      return () => listeners.get(event)?.delete(fn);
    },
    emit(event, payload) {
      listeners.get(event)?.forEach((fn) => fn(payload));
    },
  };
}
const bus = createSignalBus();

/* ====== 2. Persistance ====== */
const STORAGE_KEY = "vibe-lab-state-v1";
const saveLocal = (d) => localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
const loadLocal = () => {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || null; } catch { return null; }
};
function downloadFile(data) {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "vibe-lab-save.json"; a.click();
  URL.revokeObjectURL(url);
}
const DEFAULT_STATE = { pseudo: "Explorateur", score: 0, best: 0, volume: 60, theme: "nuit" };

/* ====== 3. Mini-jeu : Cible rapide ====== */
function ReactionGame({ state, setState, busEmit }) {
  const [target, setTarget] = useState({ x: 50, y: 50 });
  const [playing, setPlaying] = useState(false);
  const [timeLeft, setTimeLeft] = useState(10);

  useEffect(() => {
    if (!playing) return;
    const id = setInterval(() => {
      setTimeLeft((t) => {
        if (t <= 1) { setPlaying(false); busEmit("game:end", { score: state.score }); return 10; }
        return t - 1;
      });
    }, 1000);
    return () => clearInterval(id);
  }, [playing, state.score]);

  const hit = () => {
    if (!playing) return;
    setTarget({ x: 8 + Math.random() * 84, y: 8 + Math.random() * 84 });
    setState((s) => {
      const ns = { ...s, score: s.score + 1, best: Math.max(s.best, s.score + 1) };
      saveLocal(ns);
      return ns;
    });
    busEmit("target:hit", {});
  };

  return (
    <div className="flex flex-col gap-4">
      <div className="flex items-center justify-between">
        <button
          onClick={() => { setPlaying(!playing); if (!playing) { setState((s) => ({ ...s, score: 0 })); busEmit("game:start", {}); } }}
          className="rounded-lg bg-violet-600 px-4 py-2 text-sm font-semibold text-white active:scale-95"
        >{playing ? "Stop" : "▶ Jouer (10 s)"}</button>
        <span className="text-sm text-slate-300">
          Score : <b className="text-white">{state.score}</b> · Record : <b className="text-white">{state.best}</b> · ⏱ {playing ? timeLeft : 0}s
        </span>
      </div>
      <div onPointerDown={hit} className="relative h-72 w-full overflow-hidden rounded-xl border border-slate-700 bg-slate-900">
        {playing ? (
          <button style={{ left: target.x + "%", top: target.y + "%" }}
            className="absolute h-12 w-12 -translate-x-1/2 -translate-y-1/2 rounded-full bg-gradient-to-br from-pink-500 to-violet-500 shadow-lg shadow-violet-500/40 active:scale-90" />
        ) : (
          <p className="flex h-full items-center justify-center text-sm text-slate-400 px-6 text-center">
            Appuie sur « Jouer » puis touche les cibles le plus vite possible 🎯
          </p>
        )}
      </div>
    </div>
  );
}

/* ====== 4. Widgets + flux de signaux ====== */
function WidgetPanel({ state, setState, log }) {
  return (
    <div className="flex flex-col gap-5">
      <div className="flex flex-col gap-3">
        <label className="text-xs font-semibold uppercase tracking-wide text-slate-400">Pseudo</label>
        <input value={state.pseudo}
          onChange={(e) => { const ns = { ...state, pseudo: e.target.value }; setState(ns); saveLocal(ns); }}
          className="rounded-lg border border-slate-600 bg-slate-800 px-3 py-2 text-sm text-white focus:border-violet-500 focus:outline-none" />
        <label className="flex items-center justify-between text-sm text-slate-200">Volume
          <input type="range" min="0" max="100" value={state.volume}
            onChange={(e) => { const ns = { ...state, volume: Number(e.target.value) }; setState(ns); saveLocal(ns); }}
            className="w-40 accent-violet-500" />
        </label>
        <label className="flex items-center justify-between text-sm text-slate-200">
          Thème {state.theme === "nuit" ? "🌙" : "☀️"}
          <button onClick={() => { const ns = { ...state, theme: state.theme === "nuit" ? "jour" : "nuit" }; setState(ns); saveLocal(ns); }}
            className={"relative h-6 w-11 rounded-full transition " + (state.theme === "nuit" ? "bg-violet-600" : "bg-slate-600")}>
            <span className={"absolute top-0.5 h-5 w-5 rounded-full bg-white transition-all " + (state.theme === "nuit" ? "left-[22px]" : "left-0.5")} />
          </button>
        </label>
      </div>
      <div className="rounded-xl border border-slate-700 bg-black/60 p-3">
        <p className="mb-2 text-xs font-semibold uppercase tracking-wide text-slate-400">Flux de signaux (temps réel)</p>
        <div className="h-28 overflow-y-auto font-mono text-[11px] leading-5 text-emerald-400">
          {log.length === 0 ? <span className="text-slate-500">— aucun signal —</span> : log.map((l, i) => <div key={i}>{l}</div>)}
        </div>
      </div>
    </div>
  );
}

/* ====== 5. App principale ====== */
function App() {
  const [state, setState] = useState(loadLocal() || DEFAULT_STATE);
  const [tab, setTab] = useState("jeu");
  const [log, setLog] = useState([]);
  const fileInput = useRef(null);

  const busEmit = useCallback((event, payload) => {
    bus.emit(event, payload);
    setLog((l) => ["⚡ " + event + " " + JSON.stringify(payload).slice(0, 50), ...l].slice(0, 20));
  }, []);

  const importFile = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        setState(data); saveLocal(data); busEmit("file:imported", { pseudo: data.pseudo });
      } catch { busEmit("file:error", {}); }
    };
    reader.readAsText(file);
  };

  const tabs = [
    { id: "jeu", label: "🎯 Mini-jeu" },
    { id: "widgets", label: "🧩 Widgets" },
    { id: "fichiers", label: "💾 Fichiers" },
  ];

  return (
    <div className="mx-auto flex min-h-screen w-full max-w-md flex-col gap-4 p-4 text-white">
      <header className="flex items-center justify-between">
        <div>
          <h1 className="text-xl font-bold">Vibe Lab</h1>
          <p className="text-xs text-slate-400">UI · Signaux · Sauvegarde — exploration mobile</p>
        </div>
        <span className="rounded-full bg-violet-600/20 px-2 py-1 text-xs text-violet-300">{state.pseudo}</span>
      </header>

      <nav className="flex gap-1 rounded-xl bg-slate-800 p-1">
        {tabs.map((t) => (
          <button key={t.id} onClick={() => setTab(t.id)}
            className={"flex-1 rounded-lg px-2 py-2 text-xs font-semibold transition " + (tab === t.id ? "bg-violet-600 text-white" : "text-slate-300")}>
            {t.label}
          </button>
        ))}
      </nav>

      <main className="flex-1">
        {tab === "jeu" && <ReactionGame state={state} setState={setState} busEmit={busEmit} />}
        {tab === "widgets" && <WidgetPanel state={state} setState={setState} log={log} />}
        {tab === "fichiers" && (
          <div className="flex flex-col gap-4 text-sm">
            <p className="text-slate-300">Sauvegarde automatique en local (localStorage). Exporte ou importe un fichier .json pour tester la persistance.</p>
            <pre className="overflow-x-auto rounded-xl border border-slate-700 bg-black/60 p-3 font-mono text-[11px] text-cyan-300">
              {JSON.stringify(state, null, 2)}
            </pre>
            <button onClick={() => { downloadFile(state); busEmit("file:exported", {}); }}
              className="rounded-lg bg-cyan-600 px-4 py-2 text-sm font-semibold active:scale-95">⬇ Exporter en .json</button>
            <button onClick={() => fileInput.current?.click()}
              className="rounded-lg bg-emerald-600 px-4 py-2 text-sm font-semibold active:scale-95">⬆ Importer un fichier</button>
            <input ref={fileInput} type="file" accept=".json" onChange={importFile} className="hidden" />
          </div>
        )}
      </main>

      <footer className="text-center text-[11px] text-slate-500">Vibe Lab v0.2 — fait avec Vibe, testé depuis ton téléphone 📱</footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
}
</script>
</body>
</html>
