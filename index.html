<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#020617" />
<title>Vibe Lab</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950">
<div id="root"></div>

<!-- core : partagé par tous les onglets -->
<script type="text/babel" src="core/signals.js"></script>
<script type="text/babel" src="core/storage.js"></script>

<!-- un dossier par onglet : logic.js puis ui.jsx -->
<script type="text/babel" src="game/logic.js"></script>
<script type="text/babel" src="game/ui.jsx"></script>
<script type="text/babel" src="widgets/logic.js"></script>
<script type="text/babel" src="widgets/ui.jsx"></script>
<script type="text/babel" src="files/logic.js"></script>
<script type="text/babel" src="files/ui.jsx"></script>
<script type="text/babel" src="pixel/constants.js"></script>
<script type="text/babel" src="pixel/encoding.js"></script>
<script type="text/babel" src="pixel/document.js"></script>
<script type="text/babel" src="pixel/tree.js"></script>
<script type="text/babel" src="pixel/paint.js"></script>
<script type="text/babel" src="pixel/render.js"></script>
<script type="text/babel" src="pixel/history.js"></script>
<script type="text/babel" src="pixel/io.js"></script>
<script type="text/babel" src="pixel/viewport.js"></script>
<script type="text/babel" src="pixel/hooks.js"></script>
<script type="text/babel" src="pixel/components.jsx"></script>
<script type="text/babel" src="pixel/ui.jsx"></script>

<!-- app : assemblage des onglets -->
<script type="text/babel" src="app.js"></script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
}
</script>
</body>
</html>
